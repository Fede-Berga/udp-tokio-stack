[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 defines the wire format; its authors consider it complete, and replacing it changes the protocol" },
]

[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
